services:
  app:
    build: .
    ports:
      - "${SCHEDULE_BIND_IP:-10.160.46.146}:${SCHEDULE_PORT:-8060}:3000"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - schedule-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  schedule-data:
