services:
  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Без DATABASE_URL приложение хранит данные в ./data/app-state.json
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - JSON_DB_PATH=/app/data
    volumes:
      - ./data:/app/data
    # Чтобы включить PostgreSQL — раскомментируйте блок ниже и задайте
    # DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db
